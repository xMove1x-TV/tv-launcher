name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK (unsigned)
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::error::The SIGNING_KEY secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BT"
          printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/key.pk8"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$BT/apksigner" sign --key "$RUNNER_TEMP/key.pk8" --cert signing/cert.pem --out out/tv-launcher.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/key.pk8"
          "$BT/apksigner" verify --print-certs out/tv-launcher.apk
          ls -l out

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-${{ github.run_number }}
          path: out/tv-launcher.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/tv-launcher.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}" \
            --latest
